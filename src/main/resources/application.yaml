app:
  security:
    users:
      - username: admin
        password: ${APP_ADMIN_PASSWORD:admin123}
        roles:
          - ADMIN
          - USER

      - username: user
        password: ${APP_USER_PASSWORD:user123}
        roles:
          - USER

spring:
  datasource:
    url: jdbc:hsqldb:mem:chatdb
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${PRIMARY_LLM}
          temperature: 1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${SECONDARY_LLM}
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
            temperature: 1
